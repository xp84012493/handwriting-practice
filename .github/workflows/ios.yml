# 全云端 iOS：一次 archive，导出 Ad Hoc + App Store 两套 IPA，并自动上传 TestFlight。
#
# Secrets（Actions → Repository secrets）：
#   P12_BASE64                         Distribution .p12 的 Base64
#   P12_PASSWORD
#   MOBILEPROVISION_BASE64             Ad Hoc 描述文件 Base64（与 IOS_PROVISIONING_PROFILE_NAME 对应）
#   MOBILEPROVISION_APPSTORE_BASE64    App Store 描述文件 Base64（与 IOS_PROVISIONING_PROFILE_NAME_APPSTORE 对应）
#   APPLE_TEAM_ID
#   IOS_PROVISIONING_PROFILE_NAME              Ad Hoc 描述文件在后台的 Name（归档与第一次导出用）
#   IOS_PROVISIONING_PROFILE_NAME_APPSTORE     App Store 描述文件在后台的 Name
#   APP_STORE_CONNECT_ISSUER_ID                App Store Connect API Issuer ID
#   APP_STORE_CONNECT_API_KEY_ID               API Key ID（Users and Access → Keys）
#   APP_STORE_CONNECT_API_PRIVATE_KEY          AuthKey_*.p8 全文（含 BEGIN/END 行）
#
# 自动上传说明：docs/IOS_CI_UPLOAD.md
#
# 参考：https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development

name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload App Store IPA to TestFlight after build
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    # App Store Connect requires iOS 26 SDK (Xcode 26+) since 2026-04-28.
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # App Store 要求 CFBundleVersion 单调递增。CI 用 run_number 自动赋值，避免与已上传 build 冲突。
      # 公式：run_number * 10 + run_attempt（重跑 workflow 时 attempt+1，不会重复）。
      - name: Set build number from CI run
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          sed -i '' "s/^version:.*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Version for this build: ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Verify Xcode 26
        run: |
          xcodebuild -version
          xcode_version=$(xcodebuild -version | sed -n '1s/Xcode //p')
          case "$xcode_version" in
            26.*) ;;
            *)
              echo "::error::Need Xcode 26+. Got: $xcode_version"
              exit 1
              ;;
          esac
          sdk_version=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9.]+' | tail -1)
          echo "Active iOS device SDK: ${sdk_version:-none}"
          case "$sdk_version" in
            iphoneos26.*) ;;
            *)
              echo "::error::Need iOS 26 device SDK. Got: ${sdk_version:-none}"
              exit 1
              ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple certificate and provisioning profiles
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
          MOBILEPROVISION_APPSTORE_BASE64: ${{ secrets.MOBILEPROVISION_APPSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::Missing secrets: P12_BASE64, P12_PASSWORD"
            exit 1
          fi
          if [ -z "${MOBILEPROVISION_BASE64:-}" ] || [ -z "${MOBILEPROVISION_APPSTORE_BASE64:-}" ]; then
            echo "::error::Missing secrets: MOBILEPROVISION_BASE64 (Ad Hoc) and MOBILEPROVISION_APPSTORE_BASE64 (App Store)"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="actions-temp-keychain-password"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          install_profile() {
            local b64="$1"
            local tag="$2"
            local tmp="$RUNNER_TEMP/profile_${tag}.mobileprovision"
            local pls="$RUNNER_TEMP/profile_${tag}.plist"
            echo "$b64" | base64 --decode > "$tmp"
            security cms -D -i "$tmp" > "$pls"
            local uuid
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$pls")
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$tmp" "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
            echo "Installed provisioning profile ${tag} UUID=${uuid}"
          }

          install_profile "$MOBILEPROVISION_BASE64" "adhoc"
          install_profile "$MOBILEPROVISION_APPSTORE_BASE64" "appstore"

      # Flutter 不能把 `flutter build ipa --` 后面当 xcodebuild 参数；归档前改 pbxproj 为 Manual。
      # 归档阶段使用 Ad Hoc 描述文件（与第一次导出一致）。
      - name: Configure signing and ExportOptions plists
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_PROVISIONING_PROFILE_NAME_APPSTORE: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME_APPSTORE }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import plistlib
          import re

          team = (os.environ.get("APPLE_TEAM_ID") or "").strip()
          prof_adhoc = (os.environ.get("IOS_PROVISIONING_PROFILE_NAME") or "").strip()
          prof_store = (os.environ.get("IOS_PROVISIONING_PROFILE_NAME_APPSTORE") or "").strip()
          if not team or not prof_adhoc or not prof_store:
              raise SystemExit(
                  "Set APPLE_TEAM_ID, IOS_PROVISIONING_PROFILE_NAME (Ad Hoc), "
                  "IOS_PROVISIONING_PROFILE_NAME_APPSTORE (App Store)."
              )

          pbx_path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx_path, encoding="utf-8") as f:
              pbx = f.read()

          m = re.search(
              r"97C147071CF9000F007C117D /\* Release \*/ = \{[\s\S]*?"
              r"PRODUCT_BUNDLE_IDENTIFIER = ([^;\s]+);",
              pbx,
          )
          if not m:
              raise SystemExit("Could not find Runner Release PRODUCT_BUNDLE_IDENTIFIER in project.pbxproj")
          bundle_id = m.group(1)

          prof_esc = prof_adhoc.replace("\\", "\\\\").replace('"', '\\"')
          signing_lines = (
              "\t\t\t\tASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;\n"
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              f"\t\t\t\tDEVELOPMENT_TEAM = {team};\n"
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{prof_esc}";\n'
              '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n'
              "\t\t\t\tCLANG_ENABLE_MODULES = YES;"
          )

          old_release = (
              "\t\t97C147071CF9000F007C117D /* Release */ = {\n"
              "\t\t\tisa = XCBuildConfiguration;\n"
              "\t\t\tbaseConfigurationReference = 7AFA3C8E1D35360C0083082E /* Release.xcconfig */;\n"
              "\t\t\tbuildSettings = {\n"
              "\t\t\t\tASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;\n"
              "\t\t\t\tCLANG_ENABLE_MODULES = YES;"
          )
          old_profile = (
              "\t\t249021D4217E4FDB00AE95B9 /* Profile */ = {\n"
              "\t\t\tisa = XCBuildConfiguration;\n"
              "\t\t\tbaseConfigurationReference = 7AFA3C8E1D35360C0083082E /* Release.xcconfig */;\n"
              "\t\t\tbuildSettings = {\n"
              "\t\t\t\tASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;\n"
              "\t\t\t\tCLANG_ENABLE_MODULES = YES;"
          )
          new_release = (
              "\t\t97C147071CF9000F007C117D /* Release */ = {\n"
              "\t\t\tisa = XCBuildConfiguration;\n"
              "\t\t\tbaseConfigurationReference = 7AFA3C8E1D35360C0083082E /* Release.xcconfig */;\n"
              "\t\t\tbuildSettings = {\n"
              + signing_lines
          )
          new_profile = (
              "\t\t249021D4217E4FDB00AE95B9 /* Profile */ = {\n"
              "\t\t\tisa = XCBuildConfiguration;\n"
              "\t\t\tbaseConfigurationReference = 7AFA3C8E1D35360C0083082E /* Release.xcconfig */;\n"
              "\t\t\tbuildSettings = {\n"
              + signing_lines
          )

          if old_release not in pbx or old_profile not in pbx:
              raise SystemExit("project.pbxproj: expected Runner Release/Profile blocks not found.")

          pbx = pbx.replace(old_release, new_release, 1).replace(old_profile, new_profile, 1)
          with open(pbx_path, "w", encoding="utf-8") as f:
              f.write(pbx)

          def write_export(path: str, method: str, profile: str) -> None:
              data = {
                  "compileBitcode": False,
                  "method": method,
                  "signingStyle": "manual",
                  "stripSwiftSymbols": True,
                  "teamID": team,
                  "provisioningProfiles": {bundle_id: profile},
                  "signingCertificate": "Apple Distribution",
              }
              with open(path, "wb") as f:
                  plistlib.dump(data, f)

          write_export("ExportOptions-adhoc.plist", "ad-hoc", prof_adhoc)
          write_export("ExportOptions-appstore.plist", "app-store", prof_store)
          PY

      # 同一 shell：先 flutter 归档并导出 Ad Hoc，立刻复制 xcarchive 再 App Store 导出，避免中间步骤删掉 archive。
      - name: Archive once — export Ad Hoc IPA then App Store IPA
        run: |
          set -euo pipefail
          flutter build ipa --release --export-options-plist ExportOptions-adhoc.plist

          ARCHIVE="build/ios/archive/Runner.xcarchive"
          if [ ! -d "$ARCHIVE" ]; then
            ARCHIVE=$(find build/ios -type d -name "*.xcarchive" 2>/dev/null | head -1 || true)
          fi
          if [ -z "$ARCHIVE" ] || [ ! -d "$ARCHIVE" ]; then
            echo "::error::No .xcarchive found under build/ios after flutter build ipa."
            find build/ios -maxdepth 5 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Copying archive for second export: $ARCHIVE"
          rm -rf "$RUNNER_TEMP/Runner-for-export.xcarchive"
          cp -R "$ARCHIVE" "$RUNNER_TEMP/Runner-for-export.xcarchive"

          mkdir -p build/ios/ipa-appstore
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner-for-export.xcarchive" \
            -exportPath build/ios/ipa-appstore \
            -exportOptionsPlist ExportOptions-appstore.plist \
            -allowProvisioningUpdates NO

      - name: Resolve App Store IPA path
        id: appstore_ipa
        run: |
          set -euo pipefail
          IPA=$(find build/ios/ipa-appstore -maxdepth 1 -name '*.ipa' -print | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No App Store IPA found under build/ios/ipa-appstore"
            find build/ios -name '*.ipa' 2>/dev/null || true
            exit 1
          fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "App Store IPA: $IPA ($(du -h "$IPA" | cut -f1))"

      - name: Prepare App Store Connect API credentials
        if: >-
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight))
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ISSUER_ID:-}" ] || [ -z "${KEY_ID:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "::error::TestFlight upload requires repository secrets:"
            echo "  APP_STORE_CONNECT_ISSUER_ID"
            echo "  APP_STORE_CONNECT_API_KEY_ID"
            echo "  APP_STORE_CONNECT_API_PRIVATE_KEY"
            echo "See docs/IOS_CI_UPLOAD.md"
            exit 1
          fi

          ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          if printf '%s' "$PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$PRIVATE_KEY" | tr -d '[:space:]' | base64 --decode > "$KEY_PATH"
          fi

          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_API_PRIVATE_KEY must be PEM text or Base64-encoded PEM."
            exit 1
          fi

          if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>&1; then
            echo "::error::Could not parse APP_STORE_CONNECT_API_PRIVATE_KEY as a valid private key."
            exit 1
          fi

          if [ "${#KEY_ID}" -ne 10 ]; then
            echo "::warning::APP_STORE_CONNECT_API_KEY_ID length is ${#KEY_ID} (Apple Key IDs are 10 characters)."
          fi

          if ! printf '%s' "$ISSUER_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::warning::APP_STORE_CONNECT_ISSUER_ID should be a UUID from App Store Connect → Integrations → API (not the 10-char Team ID)."
          fi

          echo "ASC_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          {
            echo 'ASC_API_PRIVATE_KEY<<EOF'
            cat "$KEY_PATH"
            echo 'EOF'
          } >> "$GITHUB_ENV"

          echo "Prepared App Store Connect API key (Key ID length ${#KEY_ID}, Issuer ID length ${#ISSUER_ID})."

      - name: Verify App Store Connect API credentials
        if: >-
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight))
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const https = require('https');

          const issuerId = process.env.ASC_ISSUER_ID;
          const keyId = process.env.ASC_KEY_ID;
          const keyPem = process.env.ASC_API_PRIVATE_KEY;

          const header = Buffer.from(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' })).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const payload = Buffer.from(JSON.stringify({
            iss: issuerId,
            iat: now,
            exp: now + 1200,
            aud: 'appstoreconnect-v1',
          })).toString('base64url');
          const signingInput = `${header}.${payload}`;
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: keyPem,
            format: 'pem',
            dsaEncoding: 'ieee-p1363',
          }).toString('base64url');
          const token = `${signingInput}.${signature}`;

          const req = https.request(
            {
              hostname: 'api.appstoreconnect.apple.com',
              path: '/v1/apps?limit=1',
              method: 'GET',
              headers: { Authorization: `Bearer ${token}` },
            },
            (res) => {
              let body = '';
              res.on('data', (chunk) => { body += chunk; });
              res.on('end', () => {
                console.log(`App Store Connect API HTTP ${res.statusCode}`);
                if (res.statusCode === 401) {
                  console.error('::error::App Store Connect API auth failed (401). Re-check Issuer ID, Key ID, and .p8 secret. See docs/IOS_CI_UPLOAD.md');
                  console.error(body);
                  process.exit(1);
                }
                if (res.statusCode !== 200) {
                  console.error(`::error::App Store Connect API returned HTTP ${res.statusCode}`);
                  console.error(body);
                  process.exit(1);
                }
                console.log('App Store Connect API credentials OK');
              });
            },
          );
          req.on('error', (err) => {
            console.error(`::error::${err.message}`);
            process.exit(1);
          });
          req.end();
          NODE

      - name: Upload App Store IPA to TestFlight
        if: >-
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight))
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.appstore_ipa.outputs.path }}
          issuer-id: ${{ env.ASC_ISSUER_ID }}
          api-key-id: ${{ env.ASC_KEY_ID }}
          api-private-key: ${{ env.ASC_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'
          backend: AppStoreAPI

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipas-adhoc-and-appstore
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa-appstore/*.ipa
          if-no-files-found: error
