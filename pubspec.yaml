name: hanzi_practice_engine
description: Core data parsing and CustomPainter engine for Chinese stroke-order practice sheets.
version: 1.0.2+2
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  characters: ^1.3.0
  path_drawing: ^1.0.1
  vector_math: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  file_saver: ^0.2.14
  shared_preferences: ^2.3.0
  in_app_purchase: ^3.2.0
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sample_graphics.json
    - assets/hanzi_dictionary.json
    - assets/preset_lists.json
    - LICENSE
    - THIRD_PARTY_NOTICES.md
  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKaiGB-Regular.ttf
    - family: LXGWZhenKai
      fonts:
        - asset: assets/fonts/LXGWZhenKaiGB-Regular.ttf
